[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "environmental-enforcement-ai"
version = "0.1.0"
description = "Local-first, human-reviewed littering incident prototype"
requires-python = ">=3.11,<3.14"
dependencies = ["fastapi==0.115.12", "uvicorn[standard]==0.34.2", "sqlalchemy==2.0.41", "pydantic-settings==2.9.1", "python-multipart==0.0.20", "ultralytics==8.4.171", "torch==2.7.1", "torchvision==0.22.1", "opencv-python-headless==4.10.0.84", "numpy==2.3.5", "lap==0.5.13"]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "httpx==0.28.1", "ruff==0.11.10"]

[project.scripts]
environmental-enforcement = "app.vision.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
